<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SPLITit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="fragments :: header"></div>

<main class="main">
    <div class="main-container">
        <!-- Title Section -->
        <div class="title-section">
            <h1 class="main-title">SPLITit</h1>
            <hr class="divider">
            <h3 class="tagline">Your expense splitter</h3>
        </div>

        <div th:if="${session.currentUser == null}">
            <h2>Log på for at bruge SplitIt og inviter venner til din gruppe</h2>
        </div>

        <!-- Group Selector Section -->
        <div th:if="${session.currentUser != null}">
        <div class="selector-section">
            <h2 class="section-heading">Choose / create a group</h2>

            <form th:action="@{/expense}" method="get" class="selector-form">
                <div class="select-wrapper">
                    <select name="groupId" id="groupSelect" class="group-select" required>
                        <option value="" disabled selected>Choose a group</option>
                        <option th:each="group : ${groups}"
                                th:value="${group.groupId}"
                                th:text="${group.name}">
                            Group Name
                        </option>
                    </select>
                    <img th:src="@{/images/arrow.svg}" alt="" class="select-arrow">
                </div>

                <button type="submit" class="btn btn-primary">Show group</button>
            </form>
        </div>

        <!-- Create Group Link -->
        <div class="link-section">
            <a th:href="@{/create-group}" class="create-link">Create a group</a>
        </div>

        </div>

        <!-- Error Message -->
        <div class="error-message" th:if="${errorMessage != null}">
            <p th:text="${errorMessage}" class="error-message-text"></p>
        </div>
    </div>
</main>

<div th:replace="fragments :: footer"></div>
</body>
</html>
